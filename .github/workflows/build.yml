name: Build SmartIDE

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test

  windows:
    name: Windows build (installer + portable)
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Build release (obfuscated, tree-shaken)
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols

      - name: Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = 'build\windows\x64\runner\Release'
          Copy-Item installer\smartide.cmd "$src\smartide.cmd"
          Compress-Archive -Path "$src\*" -DestinationPath "dist\SmartIDE-${{ steps.version.outputs.version }}-portable-x64.zip" -CompressionLevel Optimal
          Remove-Item "$src\smartide.cmd"
          $size = (Get-ChildItem $src -Recurse | Measure-Object Length -Sum).Sum / 1MB
          "Unpacked size: {0:N1} MB" -f $size | Tee-Object -FilePath dist\SIZE.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\smartide.iss
          Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: SmartIDE-${{ steps.version.outputs.version }}-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SIZE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
